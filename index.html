<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes QCM de révision</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f3fb,#120d26);--card:light-dark(#fff,#1d1640);--ink:light-dark(#1a1433,#efeaff);--soft:light-dark(#5c5677,#b5aed3);--line:light-dark(#e2dcef,#352c63);--band:light-dark(#2b1d6e,#1b1250);--eo:#e2457a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
header{background:var(--band);color:#fff;padding:36px 20px 56px}
.wrap{max-width:860px;margin:0 auto}
h1{margin:0 0 8px;font-size:clamp(28px,4vw,40px)}
header p{margin:0;color:#d9d2ff}
main{padding:0 20px 56px;margin-top:-28px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px 24px;box-shadow:0 8px 24px rgba(20,10,60,.08);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--eo);transform:translateY(-2px)}
.card h2{margin:0 0 6px;font-size:20px}
.card p{margin:0;color:var(--soft);font-size:15px}
</style>
</head>
<body>
<header><div class="wrap"><h1>QCM de révision</h1><p>1 QCM disponible</p></div></header>
<main><div class="wrap"><ul><li><a class="card" href="./ue-change-energies/"><h2>UE CHANGE : Énergies fossiles ou renouvelables</h2><p>Enjeux énergétiques, ordres de grandeur, rendements, CO2 et démarche négaWatt. 22 questions sur les notions clés et conclusions du cours.</p></a></li></ul></div></main>
</body>
</html>
